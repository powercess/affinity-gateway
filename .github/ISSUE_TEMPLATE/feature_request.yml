name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        想法可以很粗，说清「要解决什么问题」比给出完整方案更重要。
        影响面较大的改动建议先在这里对齐方向，再提 PR。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在有什么不便？在什么场景下发生？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想的做法；如果还没想清楚，描述期望的最终效果也可以
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法，以及为什么不够好
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 可多选
      multiple: true
      options:
        - 入站网关（会话识别与注入）
        - 出站网关（供应商适配）
        - 强亲和判定与拒绝
        - new-api 渠道透传
        - Web 控制台
        - 部署与编排（Docker / Compose）
        - 测试与工具链
        - 文档
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: 是否愿意自己提 PR
      options:
        - 愿意，需要维护者先确认方向
        - 愿意，已阅读 CONTRIBUTING
        - 暂时没有精力，仅供参考
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 参考实现、上游讨论、截图等
    validations:
      required: false
