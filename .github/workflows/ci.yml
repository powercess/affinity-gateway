name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check for committed API keys
        run: '! git grep -nE "sk-[A-Za-z0-9_-]{20,}" -- . ":(exclude)docs/opencode-go-native-report.md"'

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f deploy/Dockerfile -t affinity-gateway:ci .
      - run: docker build -f deploy/console/Dockerfile -t affinity-console:ci .
      - run: docker build --target unit -f deploy/new-api/Dockerfile -t affinity-new-api-unit:ci deploy/new-api
      - name: Validate release Compose
        env:
          SESSION_AFFINITY_SECRET: ci-only-affinity-secret-at-least-32
          NEW_API_SESSION_SECRET: ci-only-new-api-secret-at-least-32
          POSTGRES_PASSWORD: ci-only-postgres-password
          AFFINITY_CONSOLE_PASSWORD: ci-only-console-password-at-least-32
        run: docker compose -f deploy/compose.release.yaml config --quiet
