name: session-affinity

services:
  affinity-gateway:
    image: ghcr.io/powercess/caddy-session-affinity-gateway:${AFFINITY_VERSION:-0.1.3}
    restart: unless-stopped
    environment:
      SESSION_AFFINITY_SECRET: ${SESSION_AFFINITY_SECRET:?Set SESSION_AFFINITY_SECRET}
      SUPPLIER_CONFIG_FILE: /var/lib/affinity/suppliers.json
      AFFINITY_CONSOLE_PASSWORD: ${AFFINITY_CONSOLE_PASSWORD:-}
      AFFINITY_TEST: ${AFFINITY_TEST:-false}
    volumes:
      - ./live/Caddyfile:/etc/caddy/Caddyfile:ro
      - affinity_config:/var/lib/affinity
    ports:
      - "${AFFINITY_BIND:-0.0.0.0}:${AFFINITY_API_PORT:-18343}:8236"
    depends_on:
      new-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8238/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  console:
    image: ghcr.io/powercess/caddy-session-affinity-console:${AFFINITY_VERSION:-0.1.3}
    restart: unless-stopped
    ports:
      - "${AFFINITY_BIND:-0.0.0.0}:${AFFINITY_CONSOLE_PORT:-18342}:80"
    depends_on:
      affinity-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]

  new-api:
    image: ghcr.io/powercess/caddy-session-affinity-new-api:${AFFINITY_VERSION:-0.1.3}
    restart: unless-stopped
    environment:
      SQL_DSN: postgres://affinity:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/affinity?sslmode=disable
      REDIS_CONN_STRING: redis://redis:6379
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?Set NEW_API_SESSION_SECRET}
      STRICT_SESSION_AFFINITY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: affinity
      POSTGRES_DB: affinity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - new_api_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affinity -d affinity"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  affinity_config:
  new_api_db:
